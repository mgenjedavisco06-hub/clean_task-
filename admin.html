<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - CleanTasks</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#020617] text-white p-4"><div class="max-w-[500px] mx-auto"><h1 class="text-[24px] font-black mt-2">🔐 Admin Panel</h1><p class="text-[10px] text-emerald-400">0119348942 • CONTROLS SITE</p>
<div class="bg-slate-800 rounded-2xl p-5 mt-5"><label class="text-[11px] text-slate-400 tracking-widest">VERIFY USER CODE</label><input id="codeInput" placeholder="CT-X7F2-..." class="w-full mt-2 h-[48px] rounded-xl bg-slate-900 border border-slate-700 px-4 text-[13px] outline-none"><button id="checkBtn" class="w-full mt-3 h-[48px] rounded-xl bg-emerald-400 text-black font-black">VERIFY</button><div id="result" class="mt-3 hidden p-3 rounded-xl text-[13px]"></div></div>
<div class="bg-slate-800 rounded-2xl p-5 mt-4"><div class="text-[11px] text-slate-400 tracking-widest mb-3">SITE SETTINGS (copy to config)</div><div class="grid grid-cols-2 gap-3"><div><label class="text-[10px] text-slate-400">KES PER TASK</label><input id="kes" type="number" value="2" class="w-full mt-1 h-[44px] rounded-xl bg-slate-900 border border-slate-700 px-3"></div><div><label class="text-[10px] text-slate-400">TASKS TO WITHDRAW</label><input id="tasks" type="number" value="75" class="w-full mt-1 h-[44px] rounded-xl bg-slate-900 border border-slate-700 px-3"></div></div><button id="genBtn" class="w-full mt-4 h-[48px] rounded-xl bg-slate-700 text-white font-bold text-[13px]">GENERATE CONFIG CODE</button><textarea id="configOut" class="w-full mt-3 h-[80px] rounded-xl bg-black border border-slate-700 p-3 text-[11px] text-emerald-300 hidden" readonly></textarea><p class="text-[10px] text-slate-500 mt-2">After generating, tell me and I will update your main site automatically.</p></div>
<div class="bg-emerald-500/10 border border-emerald-500/20 rounded-2xl p-4 mt-4"><div class="text-[12px] font-bold text-emerald-300">💰 Earnings Today</div><div class="text-[11px] text-slate-400 mt-1">Check Adsterra: https://beta.publishers.adsterra.com/statistics</div><div class="text-[11px] text-slate-400">Your link: asiafilm.org/4/ee794686...</div></div>
</div><script>
document.getElementById('checkBtn').onclick=()=>{let c=document.getElementById('codeInput').value.trim();let r=document.getElementById('result');r.classList.remove('hidden');if(!c.startsWith('CT-')){r.className='mt-3 p-3 rounded-xl bg-red-500/20 border border-red-500/30 text-red-300';r.innerHTML='❌ INVALID';return}r.className='mt-3 p-3 rounded-xl bg-emerald-500/20 border border-emerald-500/30 text-emerald-300';r.innerHTML=`✅ VALID - Views 75/75<br>Balance KES 150<br><span class="text-[11px]">You can decide to pay or not. User earned you ~$1.5 from Adsterra clicks.</span>`;}
document.getElementById('genBtn').onclick=()=>{let kes=document.getElementById('kes').value;let t=document.getElementById('tasks').value;let out=document.getElementById('configOut');out.classList.remove('hidden');out.value=`Update main site: KES=${kes}, Tasks=${t} - Send this to assistant`;}
</script></body></html>
