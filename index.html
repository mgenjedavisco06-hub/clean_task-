<head>

@keyframes shim{100%{left:100%}}
</style>

</head>
<body class="text-white min-h-screen pb-10">
<div class="max-w-[420px] mx-auto p-4">

<div class="flex justify-between items-center py-4">
<div class="flex items-center gap-2"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-400 flex items-center justify-center font-black text-black">C</div><div><div class="font-black leading-none">CleanTasks</div><div class="text-[10px] text-emerald-400 tracking-[0.3em]">KENYA • MPESA</div></div></div>
<div class="text-[11px] bg-slate-800 px-3 py-1 rounded-full">🟢 <span id="online">1,247</span> online</div>
</div>

<div class="glass rounded-[28px] p-6 mt-2 relative overflow-hidden">
<div class="absolute -right-10 -top-10 w-40 h-40 bg-emerald-500/20 rounded-full blur-2xl"></div>
<div class="relative">
<div class="flex justify-between"><span class="text-slate-400 text-xs tracking-widest">YOUR BALANCE</span><span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-full">KES • MPESA</span></div>
<div class="text-5xl font-black mt-2">KES <span id="bal">0</span></div>
<div class="mt-4">
<div class="flex justify-between text-xs mb-2"><span class="text-slate-400">Tasks Progress</span><span class="font-bold"><span id="views">0</span>/75</span></div>
<div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden"><div id="bar" class="h-full bg-gradient-to-r from-emerald-400 to-cyan-400 rounded-full transition-all duration-700" style="width:0%"></div></div>
<div class="text-[11px] text-slate-500 mt-2"><span id="left">75</span> tasks left • KES 2 per task</div>
</div>
</div>
</div>

<div class="glass rounded-[24px] p-5 mt-5">
<div class="flex gap-4">
<div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center text-2xl" id="taskIcon">📧</div>
<div class="flex-1"><div class="text-[11px] text-slate-400 tracking-widest">CURRENT TASK #<span id="taskNum">1</span></div><div class="font-bold text-lg leading-tight mt-1" id="taskTitle">Loading...</div><div class="text-xs text-slate-400 mt-1" id="taskDesc"></div></div>
</div>
<button id="mainBtn" onclick="doTask()" class="w-full mt-5 h-[64px] rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-black text-lg tracking-wide shimmer">👁️ VIEW TASK & EARN KES 2</button>
<div id="timerWrap" class="hidden text-center mt-3 text-xs text-yellow-300">⏳ Wait <span id="sec">6</span>s - Ad opened, don't close!</div>
<div class="flex justify-center gap-2 mt-3 text-[11px] text-slate-500"><span>⏱️ 6 sec</span><span>•</span><span>💰 Instant</span><span>•</span><span>✅ Safe</span></div>
</div>

<div id="adBox" class="mt-4 rounded-2xl overflow-hidden bg-slate-900 min-h-[100px] flex items-center justify-center">
<script async="async" data-cfasync="false" src="https://al5sm.com/a6h2u8g9p0/display.js"></script>
<div id="container-a6h2u8g9p0"></div>
</div>

<div class="glass rounded-2xl p-4 mt-4"><div class="text-xs text-slate-400 tracking-widest mb-2">RECENT EARNINGS</div><div id="history" class="text-xs space-y-2"></div></div>

<div class="flex gap-2 mt-4">
<button onclick="resetAll()" class="flex-1 h-10 rounded-xl bg-slate-800 text-xs">Reset if stuck</button>
<button onclick="location.href='admin.html'" class="flex-1 h-10 rounded-xl bg-slate-800 text-xs">Admin</button>
</div>
</div>

<script>
const TASKS=[
{t:"Clean 23 Spam Emails",d:"Mark promotions as read",i:"📧"},
{t:"Clean 15 Duplicate Photos",d:"Delete blurry duplicates",i:"🖼️"},
{t:"Clean WhatsApp Cache",d:"Clear 156MB cache",i:"💬"},
{t:"Clean 42 Old Contacts",d:"Remove inactive numbers",i:"👤"},
{t:"Clean Browser History",d:"Clear tracking cookies",i:"🌐"},
{t:"Clean App Cache",d:"Free up storage",i:"🧹"},
{t:"Verify 8 Emails",d:"Check inbox for tasks",i:"✉️"},
{t:"Organize 12 Files",d:"Sort downloads folder",i:"📁"},
];
let views = parseInt(localStorage.getItem('ct_views2')||'0');
let bal = parseInt(localStorage.getItem('ct_bal2')||'0');
let hist = JSON.parse(localStorage.getItem('ct_hist2')||'[]');
let doing = false;

function render(){
 document.getElementById('views').innerText=views;
 document.getElementById('bal').innerText=bal;
 document.getElementById('left').innerText=Math.max(0,75-views);
 document.getElementById('bar').style.width=(views/75*100)+'%';
 let t = TASKS[views % TASKS.length];
 document.getElementById('taskTitle').innerText=t.t;
 document.getElementById('taskDesc').innerText=t.d;
 document.getElementById('taskIcon').innerText=t.i;
 document.getElementById('taskNum').innerText=views+1;
 document.getElementById('history').innerHTML = hist.slice(-5).reverse().map(h=>`<div class="flex justify-between bg-slate-800/50 p-2 rounded-lg"><span>${h.t}</span><span class="text-emerald-400">+KES 2</span></div>`).join('') || '<div class="text-slate-600">No tasks yet - start earning!</div>';
 let btn=document.getElementById('mainBtn');
 if(views>=75){
   btn.innerText='✅ WITHDRAW KES 150 - GET CODE';
   btn.className='w-full mt-5 h-[64px] rounded-2xl bg-gradient-to-r from-green-400 to-yellow-300 text-black font-black text-lg tracking-wide animate-pulse';
   btn.onclick=withdraw;
 } else {
   btn.innerText='👁️ VIEW TASK & EARN KES 2';
   btn.className='w-full mt-5 h-[64px] rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-black text-lg tracking-wide shimmer';
   btn.onclick=doTask;
 }
}
render();

function doTask(){
 if(doing || views>=75) return;
 doing=true;
 let btn=document.getElementById('mainBtn');
 btn.disabled=true;
 btn.innerText='AD OPENED...';
 document.getElementById('timerWrap').classList.remove('hidden');
 
 // Trigger popunder via click (already loaded) + try direct link
 // Your direct link - replace if you have one from Adsterra dashboard
 let directLinks=["https://al5sm.com/a6h2u8g9p0"]; 
 window.open(directLinks[0], "_blank");

 let s=6;
 document.getElementById('sec').innerText=s;
 let iv=setInterval(()=>{
  s--; document.getElementById('sec').innerText=s;
  if(s<=0){
   clearInterval(iv);
   views++; bal+=2;
   let cur=TASKS[(views-1)%TASKS.length];
   hist.push({t:cur.t});
   localStorage.setItem('ct_views2',views);
   localStorage.setItem('ct_bal2',bal);
   localStorage.setItem('ct_hist2',JSON.stringify(hist));
   doing=false;
   document.getElementById('timerWrap').classList.add('hidden');
   btn.disabled=false;
   render();
  }
 },1000);
}

function withdraw(){
 let myId=Math.random().toString(36).substring(2,6).toUpperCase();
 let timeCode=Math.floor(Date.now()/1000/600);
 let deviceId=btoa(navigator.userAgent+screen.width).substring(0,10).replace(/[^A-Za-z0-9]/g,'').toUpperCase();
 let rand=Math.random().toString(36).substring(2,6).toUpperCase();
 let CODE=`CT-${myId}-${timeCode}-${deviceId}-${rand}`;
 let msg=`CODE: ${CODE}\nViews: ${views}\nBal: ${bal}\nDev: ${deviceId}`;
 window.location.href=`https://wa.me/254758279958?text=${encodeURIComponent(msg)}`;
}
function resetAll(){
 if(confirm('Reset? You lose progress')){localStorage.removeItem('ct_views2');localStorage.removeItem('ct_bal2');localStorage.removeItem('ct_hist2');location.reload();}
}
// Fake online counter
setInterval(()=>{document.getElementById('online').innerText=Math.floor(1100+Math.random()*400)},5000);
</script>
</body>
</html>
