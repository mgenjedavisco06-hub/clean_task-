<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanTasks - Earn by Cleaning</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:15px}
.card{background:white;max-width:400px;margin:20px auto;padding:20px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1);text-align:center}
.btn{background:#00c851;color:white;padding:15px 25px;border:none;border-radius:10px;font-size:18px;width:100%;cursor:pointer;font-weight:bold}
.btn:disabled{background:#ccc}
.done{background:#e8f5e9;border:2px solid #00c851}
.progress{height:10px;background:#eee;border-radius:5px;margin:10px 0}
.fill{height:100%;background:#00c851;width:0%;border-radius:5px;transition:0.5s}
</style>
</head>
<body>
<div class="card" id="app">
<h2>🧹 CleanTasks Kenya</h2>
<p>Earn KES 10 per clean task</p>
<div class="progress"><div class="fill" id="fill"></div></div>
<p id="stepText">Step 1 of 3</p>
<div id="content"></div>
</div>
<script>
let step = localStorage.getItem('ct_step') ? parseInt(localStorage.getItem('ct_step')) : 1;
let completed = localStorage.getItem('ct_done') === 'true';
function render(){
 let c = document.getElementById('content');
 let fill = document.getElementById('fill');
 let st = document.getElementById('stepText');
 if(completed){
   fill.style.width='100%';
   st.innerText='✓ All Done!';
   c.innerHTML=`<div class="done" style="padding:15px;border-radius:10px"><h3>✓ Task Completed!</h3><p>You have cleaned all images</p><p><b>KES 10 Earned - Pending Review</b></p><p style="font-size:12px;color:gray">Screenshot this page as proof</p><button class="btn" onclick="reset()">Clean Again Tomorrow</button></div>`;
   return;
 }
 fill.style.width=(step/3*100)+'%';
 st.innerText=`Step ${step} of 3`;
 if(step==1){
   c.innerHTML=`<p>Dirty image found:</p><img src="https://picsum.photos/300/150?blur=3" style="width:100%;border-radius:10px;filter:blur(5px)"><p>Click Clean to start</p><button class="btn" onclick="next()">Clean Image →</button>`;
 }
 if(step==2){
   c.innerHTML=`<p>Cleaning... 98% clean</p><img src="https://picsum.photos/300/150?blur=1" style="width:100%;border-radius:10px;filter:blur(2px)"><button class="btn" onclick="next()">Continue Cleaning →</button>`;
 }
 if(step==3){
   c.innerHTML=`<p>Final verification needed!</p><p>Click below to verify you are human and complete cleaning</p><button class="btn" id="finalBtn" onclick="finish()">✅ VERIFY & EARN KES 10</button><p style="font-size:11px;color:gray;margin-top:10px">Ad will open - close it and come back</p>`;
 }
}
function next(){step++;localStorage.setItem('ct_step', step);render();}
function finish(){
 let btn = document.getElementById('finalBtn');
 btn.innerText='✓ Verified! Opening...';
 btn.disabled=true;
 localStorage.setItem('ct_step', 3);
 window.open('https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4','_blank');
 setTimeout(()=>{completed=true;localStorage.setItem('ct_done','true');render();},1000);
}
function reset(){if(confirm('Reset for tomorrow?')){localStorage.clear();step=1;completed=false;render();}}
render();
</script>
</body>
</html>
