<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanTasks Kenya</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif;background:#020617}.glass{background:rgba(30,41,59,0.7);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08)}</style>
</head>
<body class="text-white">
<div class="max-w-[420px] mx-auto p-4 pb-10">
<div class="flex justify-between items-center py-3">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-400 flex items-center justify-center font-black text-black text-xl">C</div><div><div class="font-black leading-none">CleanTasks</div><div class="text-[10px] text-emerald-400 tracking-[0.25em] mt-1">KENYA • 0119348942</div></div></div>
<div class="text-[10px] bg-emerald-500/15 text-emerald-300 border border-emerald-500/20 px-3 py-1.5 rounded-full">🟢 LIVE</div>
</div>
<div class="glass rounded-[28px] p-6 mt-3">
<div class="flex justify-between items-center"><span class="text-[11px] text-slate-400 tracking-widest">YOUR BALANCE</span><span class="text-[9px] bg-slate-800 px-2 py-1 rounded-full">KES • M-PESA</span></div>
<div class="text-[52px] font-black mt-1 leading-none">KES <span id="bal">0</span></div>
<div class="mt-6"><div class="flex justify-between text-[12px] mb-2"><span class="text-slate-400">Progress</span><span class="font-bold"><span id="views">0</span>/75 tasks</span></div>
<div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden"><div id="bar" class="h-full bg-gradient-to-r from-emerald-400 to-cyan-400" style="width:0%"></div></div>
<div class="text-[11px] text-slate-500 mt-2"><span id="left">75</span> tasks left • KES 2 each</div></div>
</div>
<div class="glass rounded-[28px] p-5 mt-5">
<div class="flex gap-4"><div id="taskIcon" class="w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center text-2xl">📧</div>
<div class="flex-1"><div class="text-[10px] text-slate-400 tracking-widest">TASK #<span id="taskNum">1</span> • <span id="adType" class="text-yellow-300">BONUS</span></div><div id="taskTitle" class="font-bold text-[18px] leading-tight mt-1">Clean 23 Spam Emails</div><div id="taskDesc" class="text-[12px] text-slate-400 mt-1">Mark promotions as read</div></div></div>
<button id="mainBtn" class="w-full mt-5 h-[62px] rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-black text-[17px]">👁️ VIEW TASK & EARN KES 2</button>
<div id="timerWrap" class="hidden text-center mt-3 text-[12px] text-yellow-300 bg-yellow-500/10 border border-yellow-500/20 rounded-xl py-2">⏳ Wait <span id="sec">6</span>s • Ad <span id="adNum">1</span> opened</div>
</div>
<div class="mt-5 rounded-[20px] bg-slate-900 border border-yellow-500/30 p-3">
<p class="text-[10px] text-yellow-300 text-center tracking-[0.2em] mb-2 font-bold">🔥 SPONSORED • <span id="sponsorText">M-PESA BONUS</span> 🔥</p>
<a id="adLink" href="https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=bonus1" target="_blank"><img id="adImage" src="https://via.placeholder.com/400x120/FFD700/000000?text=M-PESA+BONUS+KES+500" alt="Ad" style="width:100%;border-radius:14px;display:block;min-height:110px"></a>
<button id="adBtn" class="w-full mt-3 h-[50px] rounded-xl bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-black text-[14px]">🎁 CLAIM M-PESA BONUS</button>
</div>
<div class="glass rounded-2xl p-4 mt-5"><div class="text-[11px] text-slate-400 tracking-widest mb-3">RECENT EARNINGS</div><div id="history"></div></div>
<button id="resetBtn" class="w-full mt-6 h-10 rounded-xl bg-slate-800/50 text-[12px] text-slate-500">Reset Progress</button>
</div>
<script>
const SMARTLINKS=["https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=bonus1","https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=mpesa1","https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=bonus2","https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=mpesa2","https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=kenya1"];
const ADS=[{img:"https://via.placeholder.com/400x120/FFD700/000000?text=M-PESA+BONUS+KES+500",t:"M-PESA BONUS",b:"💰 CLAIM M-PESA BONUS"},{img:"https://via.placeholder.com/400x120/00FF88/000000?text=FREE+SPINS+KENYA+100",t:"FREE SPINS",b:"🎰 CLAIM 100 FREE SPINS"},{img:"https://via.placeholder.com/400x120/FF4444/FFFFFF?text=BET+BONUS+100%25+KES",t:"BET BONUS",b:"⚡ GET 100% BONUS NOW"},{img:"https://via.placeholder.com/400x120/4488FF/FFFFFF?text=DATA+DEALS+KENYA",t:"DATA DEALS",b:"📱 CLAIM DATA DEAL"},{img:"https://via.placeholder.com/400x120/FFAA00/000000?text=WIN+KES+10000+NOW",t:"WIN CASH",b:"💎 WIN KES 10K NOW"}];
const TASKS=[{t:"Clean 23 Spam Emails",d:"Mark promotions as read",i:"📧"},{t:"Clean 15 Duplicate Photos",d:"Delete blurry duplicates",i:"🖼️"},{t:"Clean WhatsApp Cache",d:"Clear 156MB cache files",i:"💬"},{t:"Clean 42 Old Contacts",d:"Remove inactive numbers",i:"👤"},{t:"Clean Browser History",d:"Clear tracking cookies",i:"🌐"},{t:"Clean App Cache",d:"Free up phone storage",i:"🧹"}];
let views=parseInt(localStorage.getItem('ct_views2')||'0');
let bal=parseInt(localStorage.getItem('ct_bal2')||'0');
let hist=JSON.parse(localStorage.getItem('ct_hist2')||'[]');
function getLink(){return SMARTLINKS[views%SMARTLINKS.length];}
function render(){
document.getElementById('views').innerText=views;
document.getElementById('bal').innerText=bal;
document.getElementById('left').innerText=Math.max(0,75-views);
document.getElementById('bar').style.width=(views/75*100)+'%';
let task=TASKS[views%TASKS.length];
document.getElementById('taskNum').innerText=views+1;
document.getElementById('taskTitle').innerText=task.t;
document.getElementById('taskDesc').innerText=task.d;
document.getElementById('taskIcon').innerText=task.i;
let ad=ADS[views%ADS.length];
document.getElementById('adImage').src=ad.img;
document.getElementById('sponsorText').innerText=ad.t;
document.getElementById('adType').innerText=ad.t;
document.getElementById('adBtn').innerText=ad.b;
document.getElementById('adLink').href=getLink();
let hDiv=document.getElementById('history');
hDiv.innerHTML=hist.slice(-5).reverse().map(h=>`<div class="flex justify-between items-center bg-slate-800/60 p-2.5 rounded-xl text-[12px] mb-2"><span>${h.t}</span><span class="text-emerald-400 font-bold ml-2">+KES 2</span></div>`).join('')||`<div class="text-[12px] text-slate-600 text-center py-2">No tasks yet</div>`;
let btn=document.getElementById('mainBtn');
if(views>=75){btn.innerText='✅ WITHDRAW TO 0119348942';btn.className='w-full mt-5 h-[62px] rounded-2xl bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-black text-[17px]';}
else{btn.innerText='👁️ VIEW TASK & EARN KES 2';btn.className='w-full mt-5 h-[62px] rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-black text-[17px]';}
}
function doTask(){
if(views>=75){withdraw();return;}
let btn=document.getElementById('mainBtn');btn.disabled=true;
document.getElementById('timerWrap').classList.remove('hidden');
document.getElementById('adNum').innerText=(views%SMARTLINKS.length)+1;
window.open(getLink(),"_blank");
let s=6;document.getElementById('sec').innerText=s;btn.innerText=`WAIT ${s}s...`;
let iv=setInterval(()=>{s--;document.getElementById('sec').innerText=s;btn.innerText=`WAIT ${s}s...`;if(s<=0){clearInterval(iv);views++;bal+=2;hist.push({t:TASKS[(views-1)%TASKS.length].t});localStorage.setItem('ct_views2',views);localStorage.setItem('ct_bal2',bal);localStorage.setItem('ct_hist2',JSON.stringify(hist));document.getElementById('timerWrap').classList.add('hidden');btn.disabled=false;render();}},1000);
}
function withdraw(){let id=Math.random().toString(36).substring(2,6).toUpperCase();let time=Math.floor(Date.now()/1000/600);let dev=btoa(navigator.userAgent).substring(0,10).replace(/[^A-Za-z0-9]/g,'').toUpperCase();let rand=Math.random().toString(36).substring(2,6).toUpperCase();let CODE=`CT-${id}-${time}-${dev}-${rand}`;let msg=`Hello CleanTasks!\n\nCODE: ${CODE}\nViews: ${views}/75\nBalance: KES ${bal}\nPhone: 0119348942\n\nPlease verify.`;window.location.href=`https://wa.me/254119348942?text=${encodeURIComponent(msg)}`;}
document.getElementById('mainBtn').addEventListener('click',doTask);
document.getElementById('adBtn').addEventListener('click',()=>window.open(getLink(),"_blank"));
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('Reset?')){localStorage.removeItem('ct_views2');localStorage.removeItem('ct_bal2');localStorage.removeItem('ct_hist2');location.reload();}});
render();
</script>
</body>
</html>
