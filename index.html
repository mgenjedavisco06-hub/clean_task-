<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CleanTasks</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#fff;color:#111827}.header{padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:#fff}.logo{font-weight:800;font-size:20px}.logo span{color:#10b981}.bal{background:#f9fafb;border:1px solid #eee;padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px}.grid{padding:16px 12px 100px 12px;display:grid;gap:12px}.task{border:1px solid #f3f4f6;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center}.btn{background:#111827;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700}.btn-green{background:#10b981;color:#fff;width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;text-align:center;display:block;text-decoration:none;margin:10px 0}.progress{height:4px;background:#f3f4f6;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#111827}</style></head><body><div class="header"><div class="logo">Clean<span>Tasks</span></div><div class="bal" id="bal">KSh 0</div></div><div style="padding:20px 20px 0"><h2 style="font-size:16px">Available tasks</h2><p style="font-size:12px;color:#6b7280"><span id="left">10</span> left • KSh 2 each</p><div class="progress" style="margin-top:10px"><div id="prog" style="width:0%"></div></div></div><div class="grid" id="tasks"></div><div id="flow" style="display:none;padding:20px"></div><script>const REWARD=2;const DIRECT_LINK="https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4";let data=JSON.parse(localStorage.getItem('ct')||'{"balance":0,"today":0,"date":""}');let today=new Date().toDateString();if(data.date!==today){data.today=0;data.date=today}function save(){localStorage.setItem('ct',JSON.stringify(data));ui()}function ui(){document.getElementById('bal').innerText='KSh '+data.balance;document.getElementById('prog').style.width=(data.today/10*100)+'%';document.getElementById('left').innerText=(10-data.today)}const tasks=[{t:"TikTok Follow",d:"Follow + like",i:"📱"},{t:"YouTube Sub",d:"Subscribe + watch",i:"▶️"},{t:"Facebook Like",d:"Like page",i:"👍"},{t:"Instagram Follow",d:"Follow + like",i:"📸"},{t:"Google Search",d:"Search + visit",i:"🔍"},{t:"App Review",d:"Write review",i:"⭐"},{t:"X Follow",d:"Follow + RT",i:"🐦"},{t:"Watch Ad",d:"Watch 30s",i:"🎬"},{t:"Read Article",d:"Read 1 min",i:"📰"},{t:"Join Channel",d:"Join WhatsApp",i:"💬"}];function render(){let h='';tasks.slice(0,10-data.today).forEach((x,i)=>{h+=`<div class="task"><div style="display:flex;gap:12px;align-items:center"><div style="width:44px;height:44px;background:#f3f4f6;border-radius:12px;display:flex;align-items:center;justify-content:center">${x.i}</div><div><h4 style="font-size:14px">${x.t}</h4><p style="font-size:12px;color:#6b7280">${x.d}</p></div></div><div style="text-align:right"><div style="font-size:12px;color:#10b981;font-weight:700">KSh 2</div><button class="btn" onclick="start(${i})">Start</button></div></div>`});document.getElementById('tasks').innerHTML=h||'<p style="text-align:center;padding:20px">Done today</p>'}let cur=0,page=1,tInt=null,sec=10,clicked=false;function start(i){cur=i;page=1;clicked=false;show()}function show(){document.getElementById('tasks').style.display='none';const f=document.getElementById('flow');f.style.display='block';f.innerHTML=`<p style="font-size:12px;color:#6b7280">Task ${cur+1} - Page ${page}/3</p><div class="progress" style="margin:8px 0"><div style="width:${page/3*100}%"></div></div><div style="border:1px dashed #d1d5db;border-radius:14px;height:100px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:12px;margin:12px 0">Ad Zone ${page}</div><div style="text-align:center;margin:16px 0"><b id="tm" style="font-size:22px">10s</b></div>${page==3?`<a href="${DIRECT_LINK}" target="_blank" onclick="clicked=true;document.getElementById('next').disabled=false" class="btn-green">🔗 Open Task Link to Complete</a>`:''}<button class="btn" id="next" disabled style="width:100%;padding:14px" onclick="next()">${page==3?'Verify & Earn':'Continue'}</button><button class="btn" style="width:100%;padding:14px;margin-top:8px;background:#fff;color:#111827;border:1px solid #eee" onclick="cancel()">Cancel</button>`;sec=10;clearInterval(tInt);tInt=setInterval(()=>{sec--;let e=document.getElementById('tm');if(e)e.innerText=sec+'s';if(sec<=0){clearInterval(tInt);if(page<3||clicked){document.getElementById('next').disabled=false;if(e)e.innerText='Ready ✓'}}},1000)}function next(){if(page<3){page++;show()}else{if(!clicked){alert('Click Open Task Link first');return}data.balance+=REWARD;data.today+=1;save();alert('Earned KSh 2');cancel()}}function cancel(){clearInterval(tInt);document.getElementById('flow').style.display='none';document.getElementById('tasks').style.display='grid';render();ui()}ui();render();</script></body></html>
