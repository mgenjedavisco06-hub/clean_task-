<!DOCTYPE html>
<html lang="en">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f7fb;color:#111;padding:12px}
.header{background:#fff;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:sticky;top:10px;z-index:10}
.progress{font-weight:bold;color:#0a7c3e}
.balance{background:#e8f5e9;padding:6px 12px;border-radius:20px;font-weight:bold}
.tasks{margin-top:14px;display:grid;gap:10px}
.task-card{background:#fff;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.task-card.done{opacity:0.5}
.task-img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#eee}
.task-info{flex:1}
.task-title{font-size:14px;font-weight:600}
.task-reward{font-size:12px;color:#0a7c3e;margin-top:2px}
.btn{background:#111;color:#fff;border:0;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.btn:disabled{background:#ccc}
.ad-box{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:8px;margin:14px 0;text-align:center;min-height:90px}
.footer{text-align:center;padding:20px 10px;color:#777;font-size:12px}
#payoutSection{display:none;background:#fff;border:2px solid #25D366;border-radius:16px;padding:18px;margin:18px 0;text-align:center;box-shadow:0 4px 12px rgba(37,211,102,0.15)}
#payoutSection.show{display:block}
.code-box{background:#f0f0f0;padding:10px;border-radius:8px;font-family:monospace;font-weight:bold;letter-spacing:2px;margin:10px 0;font-size:18px}
.wa-btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;padding:12px 20px;border-radius:30px;font-weight:bold;font-size:15px;margin-top:10px}
.wa-btn.disabled{background:#ccc;pointer-events:none}
.wa-btn svg{width:22px;height:22px;fill:#fff}
.timer-box{background:#fff3cd;padding:8px 12px;border-radius:8px;margin:10px 0;font-size:13px;color:#664d03}
.withdraw-info{background:#e8f5e9;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div class="header">
  <div class="progress"><span id="done">0</span>/75 Today</div>
  <div class="balance">KES <span id="bal">0</span> /150</div>
</div>

<div id="resetTimer" class="timer-box" style="display:none">⏰ New tasks in: <span id="countdown"></span></div>

<div class="ad-box">
  <small style="color:#999;font-size:10px">Advertisement</small>
  <script data-cfasync="false" src="https://bicea.org/14/7ff467c0d12ce4158673d459a13e1b3f"></script>
</div>

<div class="tasks" id="taskList"></div>

<div id="payoutSection">
  <div style="font-size:22px">🎉 KES 150 Reached!</div>
  <div class="code-box" id="userCode">CT-XXXX</div>
  <div id="withdrawStatus"></div>
  <input id="mpesaNum" placeholder="Enter your M-Pesa number 07xx" style="width:90%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:10px;text-align:center">
  <br>
  <a id="waLink" class="wa-btn" target="_blank" href="#">
    <svg viewBox="0 0 24 24"><path d="M19.05 4.91A9.82 9.82 0 0 0 12.03 2C6.51 2 2.03 6.48 2.03 12c0 1.76.46 3.48 1.32 4.99L2 22l5.19-1.35A9.82 9.82 0 0 0 12.03 22c5.52 0 10-4.48 10-10 0-2.67-1.04-5.17-2.98-7.09ZM12.03 20a7.9 7.9 0 0 1-4.03-1.1l-.29-.17-3.08.8.82-3-.19-.31A7.93 7.93 0 0 1 4.03 12c0-4.41 3.59-8 8-8 2.14 0 4.15.83 5.66 2.34A7.95 7.95 0 0 1 20.03 12c0 4.41-3.59 8-8 8Zm4.54-5.95c-.25-.12-1.47-.73-1.7-.81-.23-.09-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.24-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.84-.86 2.05s.88 2.38 1 2.54c.12.17 1.74 2.65 4.22 3.72.59.25 1.05.4 1.41.52.59.19 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.2-.58.2-1.08.14-1.18-.06-.11-.23-.17-.48-.29Z"/></svg>
    <span id="waBtnText">Withdraw on WhatsApp</span>
  </a>
</div>

<div id="needMore" style="display:none;background:#fff;border-radius:12px;padding:14px;margin:18px 0;text-align:center">You have KES <span id="needBal">0</span> - Need KES 150 to withdraw.<br>Come back after 24hrs for new tasks!</div>

<div class="ad-box">
  <small style="color:#999;font-size:10px">Sponsored</small>
  <div id="container-79cbe257bdf87fc635325c2dc792d823"></div>
</div>

<div class="footer">💰 Withdrawals: Fridays & Sundays Only | Tasks reset every 24hrs<br><button onclick="localStorage.clear();location.reload();" style="margin-top:10px;padding:6px 10px;border-radius:10px;border:1px solid #ccc;background:#fff">Reset All (Test)</button></div>

<script async="async" data-cfasync="false" src="https://bicea.org/21/79cbe257bdf87fc635325c2dc792d823"></script>

<script>
const TOTAL = 75;
const REWARD = 1;
const MIN_WITHDRAW = 150;
const RESET_HOURS = 24;

let done = parseInt(localStorage.getItem('done')||'0');
let bal = parseInt(localStorage.getItem('bal')||'0');
let lastReset = parseInt(localStorage.getItem('lastReset')||Date.now().toString());

const now = Date.now();
const hoursPassed = (now - lastReset) / (1000*60*60);
if(hoursPassed >= RESET_HOURS){
  done = 0;
  localStorage.setItem('done', '0');
  localStorage.setItem('lastReset', now.toString());
  lastReset = now;
}

const tasksData = Array.from({length:TOTAL}, (_,i)=>({id:i+1,title:`Task ${i+1}: Follow & Like Partner Page`,reward:`+ KES ${REWARD}`,img:`https://picsum.photos/seed/task${i+1}/100/100`}));

function getCode(){
  let c = localStorage.getItem('userCode');
  if(!c){ c = 'CT-' + Math.random().toString(36).substr(2,6).toUpperCase(); localStorage.setItem('userCode', c); }
  return c;
}

function isWithdrawalDay(){
  const day = new Date().getDay(); // 0=Sun, 5=Fri
  return day === 0 || day === 5;
}

function getNextWithdrawalDay(){
  const today = new Date();
  const day = today.getDay();
  let daysUntil = 0;
  if(day < 5){ daysUntil = 5 - day; } // next is Friday
  else if(day === 5){ daysUntil = 0; }
  else if(day === 6){ daysUntil = 1; } // Saturday -> Sunday
  else if(day === 0){ daysUntil = 0; } // Sunday
  const next = new Date();
  next.setDate(today.getDate() + daysUntil);
  const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return names[next.getDay()] + ' (' + next.toLocaleDateString() + ')';
}

function render(){
  document.getElementById('done').innerText = done;
  document.getElementById('bal').innerText = bal;
  const list = document.getElementById('taskList');
  list.innerHTML='';
  tasksData.forEach(t=>{
    const isDone = t.id <= done;
    const div = document.createElement('div');
    div.className = 'task-card'+(isDone?' done':'');
    div.innerHTML = `<img class="task-img" src="${t.img}"><div class="task-info"><div class="task-title">${t.title}</div><div class="task-reward">${isDone?'Completed':t.reward}</div></div><button class="btn" ${isDone?'disabled':''} onclick="doTask(${t.id})">${isDone?'Done':'Do Task'}</button>`;
    list.appendChild(div);
  });

  if(done >= TOTAL){
    document.getElementById('resetTimer').style.display='block';
  }

  if(bal >= MIN_WITHDRAW){
    document.getElementById('payoutSection').classList.add('show');
    document.getElementById('needMore').style.display='none';
    const code = getCode();
    document.getElementById('userCode').innerText = code;
    const mpesaInput = document.getElementById('mpesaNum');
    const statusDiv = document.getElementById('withdrawStatus');
    const waBtn = document.getElementById('waLink');
    const waText = document.getElementById('waBtnText');

    if(isWithdrawalDay()){
      statusDiv.innerHTML = `<div class="withdraw-info">✅ Today is withdrawal day! (Friday/Sunday)</div>`;
      waBtn.classList.remove('disabled');
      waText.innerText = 'Withdraw KES 150 on WhatsApp';
    } else {
      const nextDay = getNextWithdrawalDay();
      statusDiv.innerHTML = `<div class="timer-box">⏳ Withdrawals only on <b>Fridays & Sundays</b><br>Next withdrawal: <b>${nextDay}</b><br>Your balance is safe - come back then!</div>`;
      waBtn.classList.add('disabled');
      waText.innerText = `Withdrawals Closed - Open ${nextDay}`;
    }

    function updateWa(){
      const mpesa = mpesaInput.value || 'Not entered';
      const msg = `Hi, I reached KES 150.%0A%0AMy Code: ${code}%0AM-Pesa: ${mpesa}%0ABalance: KES ${bal}%0A%0APlease pay me. Today is ${new Date().toLocaleDateString()}`;
      waBtn.href = `https://wa.me/254119348942?text=${msg}`;
    }
    mpesaInput.addEventListener('input', updateWa);
    updateWa();
  } else if(done >= TOTAL){
    document.getElementById('needMore').style.display='block';
    document.getElementById('needBal').innerText = bal;
    document.getElementById('payoutSection').classList.remove('show');
  }
}

function doTask(id){
  if(id !== done+1) return;
  if(done >= TOTAL) return;
  const btn = event.target;
  btn.innerText = 'Verifying...';
  btn.disabled = true;
  setTimeout(()=>{
    done++; bal+=REWARD;
    localStorage.setItem('done', done);
    localStorage.setItem('bal', bal);
    render();
    window.scrollBy({top:80, behavior:'smooth'});
  }, 1500);
}

setInterval(()=>{
  const nextReset = lastReset + (RESET_HOURS*60*60*1000);
  const diff = nextReset - Date.now();
  if(diff <=0){ location.reload(); return; }
  const h = Math.floor(diff/1000/60/60);
  const m = Math.floor((diff/1000/60)%60);
  const s = Math.floor((diff/1000)%60);
  const el = document.getElementById('countdown');
  if(el) el.innerText = `${h}h ${m}m ${s}s`;
},1000);

render();
</script>
</body>
</html>
