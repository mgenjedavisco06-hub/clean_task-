<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanTasks KE</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:sans-serif;background:#020617}</style></head><body class="text-white"><div class="max-w-[400px] mx-auto p-4">
<div class="bg-slate-800 rounded-[24px] p-5 mt-3"><div class="text-[11px] text-slate-400">YOUR BALANCE</div><div class="text-[48px] font-black">KES <span id="bal">0</span></div><div class="w-full h-3 bg-slate-700 rounded-full mt-3 overflow-hidden"><div id="bar" class="h-full bg-emerald-400" style="width:0%"></div></div><div class="text-[11px] text-slate-500 mt-2"><span id="views">0</span>/75 tasks</div></div>
<div class="bg-slate-800 rounded-[24px] p-5 mt-4"><div id="taskTitle" class="font-bold text-[18px]">Clean 23 Spam Emails</div><div id="taskDesc" class="text-[12px] text-slate-400">Mark as read</div><button id="mainBtn" class="w-full mt-4 h-[60px] rounded-2xl bg-emerald-400 text-black font-black">VIEW TASK & EARN KES 2</button><div id="timerWrap" class="hidden text-center mt-2 text-[12px] text-yellow-300">Wait <span id="sec">6</span>s</div></div>
<div class="mt-4 rounded-[20px] bg-slate-900 border border-emerald-500/20 p-3"><p class="text-[10px] text-emerald-300 text-center font-bold">✓ TRUSTED PARTNER • <span id="sponsorText">SAFARICOM DATA</span> ✓</p><img id="adImage" src="https://via.placeholder.com/400x120/10B981/FFFFFF?text=SAFARICOM+5GB+DATA" style="width:100%;border-radius:12px;margin-top:8px"><button id="adBtn" class="w-full mt-3 h-[48px] rounded-xl bg-emerald-400 text-black font-black text-[14px]">VIEW OFFER</button></div>
<div class="bg-slate-800/50 rounded-xl p-3 mt-4 text-[11px] text-slate-500 text-center">Earns KES 2 per task • Withdraw to 0119348942 at 75 tasks</div></div>
<script>
const LINKS=["https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=1","https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=2","https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4?ad=3"];
const ADS=[["SAFARICOM 5GB DATA KES 99","SAFARICOM DATA"],["M-PESA CASHBACK KES 100","M-PESA REWARD"],["PHONE CLEANER FREE UP 2GB","PHONE CLEANER"],["AIRTEL 10GB NIGHT DATA","AIRTEL DATA"]];
const TASKS=[["Clean 23 Spam Emails","Mark as read"],["Clean Duplicate Photos","Delete blurry"],["Clean WhatsApp Cache","Clear 156MB"],["Clean Old Contacts","Remove inactive"],["Clean Browser History","Clear cookies"]];
let v=parseInt(localStorage.getItem('ct_v')||'0');let b=parseInt(localStorage.getItem('ct_b')||'0');
function getLink(){return LINKS[v%LINKS.length]}
function render(){document.getElementById('views').innerText=v;document.getElementById('bal').innerText=b;document.getElementById('bar').style.width=(v/75*100)+'%';let t=TASKS[v%TASKS.length];document.getElementById('taskTitle').innerText=t[0];document.getElementById('taskDesc').innerText=t[1];let a=ADS[v%ADS.length];document.getElementById('adImage').src="https://via.placeholder.com/400x120/10B981/FFFFFF?text="+encodeURIComponent(a[0]);document.getElementById('sponsorText').innerText=a[1];let btn=document.getElementById('mainBtn');btn.innerText=v>=75?"WITHDRAW TO 0119348942":"VIEW TASK & EARN KES 2"}
function doTask(){if(v>=75){let c="CT-"+Math.random().toString(36).slice(2,6).toUpperCase();window.location.href="https://wa.me/254119348942?text="+encodeURIComponent("CODE:"+c+" Views:"+v+" Bal:KES "+b);return}let btn=document.getElementById('mainBtn');btn.disabled=true;document.getElementById('timerWrap').classList.remove('hidden');window.open(getLink(),"_blank");let s=6;document.getElementById('sec').innerText=s;let iv=setInterval(()=>{s--;document.getElementById('sec').innerText=s;if(s<=0){clearInterval(iv);v++;b+=2;localStorage.setItem('ct_v',v);localStorage.setItem('ct_b',b);document.getElementById('timerWrap').classList.add('hidden');btn.disabled=false;render()}},1000)}
document.getElementById('mainBtn').onclick=doTask;document.getElementById('adBtn').onclick=()=>window.open(getLink(),"_blank");render();
</script></body></html>
