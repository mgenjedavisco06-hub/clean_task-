<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
body{font-family:'Outfit',sans-serif;background:#020617}
.glass{background:rgba(30,41,59,0.8);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1)}
</style>

<body class="text-white min-h-screen pb-10">
<div class="max-w-[420px] mx-auto p-4">

<div class="flex justify-between items-center py-4">
<div class="flex items-center gap-2"><div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-400 flex items-center justify-center font-black text-black">C</div><div><div class="font-black">CleanTasks</div><div class="text-[10px] text-emerald-400 tracking-[0.3em]">KENYA • MPESA</div></div></div>
<div class="text-[11px] bg-slate-800 px-3 py-1 rounded-full">🟢 1191 online</div>
</div>

<div class="glass rounded-[28px] p-6 mt-2">
<div class="flex justify-between"><span class="text-slate-400 text-xs">YOUR BALANCE</span><span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-full">KES • MPESA</span></div>
<div class="text-5xl font-black mt-2">KES <span id="bal">0</span></div>
<div class="mt-4">
<div class="flex justify-between text-xs mb-2"><span class="text-slate-400">Tasks Progress</span><span class="font-bold"><span id="views">0</span>/75</span></div>
<div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden"><div id="bar" class="h-full bg-gradient-to-r from-emerald-400 to-cyan-400 rounded-full" style="width:0%"></div></div>
<div class="text-[11px] text-slate-500 mt-2"><span id="left">75</span> tasks left • KES 2 per task</div>
</div>
</div>

<div class="glass rounded-[24px] p-5 mt-5">
<div class="flex gap-4">
<div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center text-2xl" id="taskIcon">📧</div>
<div class="flex-1"><div class="text-[11px] text-slate-400">CURRENT TASK #<span id="taskNum">1</span></div><div class="font-bold text-lg mt-1" id="taskTitle">Loading...</div><div class="text-xs text-slate-400 mt-1" id="taskDesc"></div></div>
</div>
<button id="mainBtn" onclick="doTask()" class="w-full mt-5 h-[64px] rounded-2xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-black text-lg">👁️ VIEW TASK & EARN KES 2</button>
<div id="timerWrap" class="hidden text-center mt-3 text-xs text-yellow-300">⏳ Wait <span id="sec">6</span>s - Ad opened!</div>
</div>

<!-- THIS BOX WILL NOW SHOW ADS - NO MORE BLANK -->
<div class="mt-4 rounded-2xl bg-slate-800 border border-yellow-500/30 p-3">
<p class="text-[10px] text-yellow-300 text-center tracking-widest mb-2">🔥 SPONSORED - CLICK TO SUPPORT US 🔥</p>
<a href="https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4" target="_blank" rel="noopener">
<img src="https://i.imgur.com/8Km9tLL.gif" style="width:100%; border-radius:12px; min-height:90px; background:#111;" alt="Ad - Click here" onerror="this.src='https://via.placeholder.com/320x100/FFD700/000000?text=CLICK+HERE+TO+EARN+BONUS'">
</a>
<button onclick="window.open('https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4','_blank')" class="w-full mt-2 h-12 rounded-xl bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-black">🎁 CLAIM KES 500 BONUS - TAP HERE</button>
<p class="text-[9px] text-white/30 text-center mt-2">Ad supports CleanTasks - Thanks!</p>
</div>

<div class="glass rounded-2xl p-4 mt-4"><div class="text-xs text-slate-400 mb-2">RECENT EARNINGS</div><div id="history" class="text-xs space-y-2"></div></div>

<div class="flex gap-2 mt-4">
<button onclick="resetAll()" class="flex-1 h-10 rounded-xl bg-slate-800 text-xs">Reset</button>
<button onclick="location.href='admin.html'" class="flex-1 h-10 rounded-xl bg-slate-800 text-xs">Admin</button>
</div>
</div>

<script>
const SMARTLINK = "https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4";
const TASKS=[{t:"Clean 23 Spam Emails",d:"Mark promotions as read",i:"📧"},{t:"Clean 15 Duplicate Photos",d:"Delete blurry duplicates",i:"🖼️"},{t:"Clean WhatsApp Cache",d:"Clear 156MB cache",i:"💬"},{t:"Clean 42 Old Contacts",d:"Remove inactive numbers",i:"👤"},{t:"Clean Browser History",d:"Clear tracking cookies",i:"🌐"},{t:"Clean App Cache",d:"Free up storage",i:"🧹"}];
let views=parseInt(localStorage.getItem('ct_views2')||'0');
let bal=parseInt(localStorage.getItem('ct_bal2')||'0');
let hist=JSON.parse(localStorage.getItem('ct_hist2')||'[]');
let doing=false;
function render(){
 document.getElementById('views').innerText=views;
 document.getElementById('bal').innerText=bal;
 document.getElementById('left').innerText=Math.max(0,75-views);
 document.getElementById('bar').style.width=(views/75*100)+'%';
 let t=TASKS[views%TASKS.length];
 document.getElementById('taskTitle').innerText=t.t;
 document.getElementById('taskDesc').innerText=t.d;
 document.getElementById('taskIcon').innerText=t.i;
 document.getElementById('taskNum').innerText=views+1;
 document.getElementById('history').innerHTML=hist.slice(-5).reverse().map(h=>`<div class="flex justify-between bg-slate-800/50 p-2 rounded-lg"><span>${h.t}</span><span class="text-emerald-400">+KES 2</span></div>`).join('')||'<div class="text-slate-600">No tasks yet</div>';
 let btn=document.getElementById('mainBtn');
 if(views>=75){btn.innerText='✅ WITHDRAW KES 150'; btn.onclick=withdraw;}else{btn.innerText='👁️ VIEW TASK & EARN KES 2'; btn.onclick=doTask;}
}
render();
function doTask(){
 if(doing||views>=75)return;
 doing=true;
 let btn=document.getElementById('mainBtn');
 btn.disabled=true; btn.innerText='AD OPENED... WAIT';
 document.getElementById('timerWrap').classList.remove('hidden');
 window.open(SMARTLINK,"_blank");
 let s=6; document.getElementById('sec').innerText=s;
 let iv=setInterval(()=>{
  s--; document.getElementById('sec').innerText=s;
  if(s<=0){
   clearInterval(iv); views++; bal+=2; hist.push({t:TASKS[(views-1)%TASKS.length].t});
   localStorage.setItem('ct_views2',views); localStorage.setItem('ct_bal2',bal); localStorage.setItem('ct_hist2',JSON.stringify(hist));
   doing=false; document.getElementById('timerWrap').classList.add('hidden'); btn.disabled=false; render();
   // Second ad for double earnings
   setTimeout(()=>{window.open(SMARTLINK,"_blank");},500);
  }
 },1000);
}
function withdraw(){
 let myId=Math.random().toString(36).substring(2,6).toUpperCase();
 let timeCode=Math.floor(Date.now()/1000/600);
 let deviceId=btoa(navigator.userAgent).substring(0,10).replace(/[^A-Za-z0-9]/g,'').toUpperCase();
 let rand=Math.random().toString(36).substring(2,6).toUpperCase();
 let CODE=`CT-${myId}-${timeCode}-${deviceId}-${rand}`;
 let msg=`CODE: ${CODE}%0AViews: ${views}%0ABal: ${bal}%0ADev: ${deviceId}`;
 window.location.href=`https://wa.me/254758279958?text=${encodeURIComponent(msg)}`;
}
function resetAll(){if(confirm('Reset?')){localStorage.clear();location.reload();}}
</script>
</body>
</html>
