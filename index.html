<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanTasks</title></head><body style="font-family:Arial;padding:20px;text-align:center"><h2>🧹 CleanTasks Kenya</h2><p>Balance: <b id="b">KES 0</b></p><div id="app"></div><script>
const AD='https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4';
const tasks=['YouTube','TikTok','Instagram','Facebook','X','WhatsApp'];
let data=JSON.parse(localStorage.getItem('c')||'{}');
function render(){
let done=Object.keys(data).length;
document.getElementById('b').innerText='KES '+(done*2);
let h='';
tasks.forEach(t=>{
let d=data[t];
h+=`<div style="border:1px solid #ccc;padding:12px;border-radius:10px;margin:8px 0;text-align:left"><b>${t}</b> - <span style="font-size:12px;padding:3px 8px;border-radius:10px;background:${d?'#00c851':'#fff3e0'};color:${d?'white':'orange'}">${d?'✓ COMPLETED - KES 2':'⏳ NOT DONE'}</span><br><button onclick="go('${t}')" style="margin-top:8px;padding:10px;width:100%;background:${d?'#ccc':'#00c851'};color:white;border:none;border-radius:8px">${d?'Paid':'Continue →'}</button></div>`;
});
if(done===6)h+=`<div style="background:#e8f5e9;border:2px solid #00c851;padding:15px;border-radius:12px"><h3>✓ Task Completed!</h3><h2>KES ${done*2} Earned</h2><p>Screenshot this</p></div>`;
document.getElementById('app').innerHTML=h;
}
function go(t){window.open(AD,'_blank');setTimeout(()=>{data[t]=1;localStorage.setItem('c',JSON.stringify(data));render();},1000);}
render();
</script></body></html>
