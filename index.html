<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Outfit',sans-serif;background:#020617}
.glass{background:rgba(30,41,59,0.7);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08)}

<body class="text-white">
<div class="max-w-[420px] mx-auto p-4 pb-12">

<!-- Header -->

<div><div class="font-black leading-none">CleanTasks</div><div class="text-[10px] text-emerald-400 tracking-[0.25em] mt-1">KENYA • 0119348942</div></div>
</div>
<div class="text-[10px] bg-emerald-500/15 text-emerald-300 border border-emerald-500/20 px-3 py-1.5 rounded-full">🟢 LIVE</div>
</div>

<!-- Balance -->
<div class="glass rounded-[28px] p-6 mt-3">
<div class="flex justify-between items-center">
<span class="text-[11px] text-slate-400 tracking-widest">YOUR BALANCE</span>
<span class="text-[9px] bg-slate-800 px-2 py-1 rounded-full">KES • M-PESA</span>
