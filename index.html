
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanTasks Kenya</title>
<style>body{font-family:system-ui;background:#f0f9ff;margin:0;padding:15px}.card{background:#fff;border-radius:16px;padding:20px;max-width:420px;margin:auto;box-shadow:0 4px 20px rgba(0,0,0,.1)}.btn{background:#16a34a;color:#fff;border:0;padding:14px;width:100%;border-radius:10px;font-weight:bold;font-size:16px;margin:6px 0}.btn:disabled{background:#9ca3af}.progress{height:12px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#16a34a;width:0%}.small{font-size:12px;color:#6b7280}</style>
<script data-cfasync="false" src="https://bicea.org/14/7ff467c0d12ce4158673d459a13e1b3f"></script>
<script data-cfasync="false" src="https://afders.org/1/0036d0d16690f48467121eddb5f6fd36"></script>
</head><body><div class="card"><h2 style="text-align:center">🇰🇪 CleanTasks Kenya</h2><p style="text-align:center">Do 75 tasks • Earn KES 150</p><div>Balance: <b>KES <span id="bal">0</span></b> | Views: <span id="views">0</span>/75</div><div class="progress"><div class="bar" id="bar"></div></div><button class="btn" id="taskBtn" onclick="doTask()">👁️ VIEW TASK - Earn KES 2</button><p class="small" id="status">Each task opens ad. Wait 6 sec.</p><div id="container-79cbe257bdf87fc635325c2dc792d823" style="margin:10px 0"></div><div id="historyBox" style="max-height:120px;overflow:auto;font-size:12px;background:#f9fafb;padding:8px;border-radius:8px;margin:10px 0"></div><button class="btn" id="withdrawBtn" onclick="withdraw()" disabled style="background:#f59e0b">🔒 Complete 75 tasks</button><p class="small">Send CODE to WhatsApp 0119348942</p><p class="small"><a href="#" onclick="localStorage.clear();location.reload();return false">Reset if stuck</a></p></div>
<script async="async" data-cfasync="false" src="https://bicea.org/21/79cbe257bdf87fc635325c2dc792d823"></script>
<script>
const AD_LINK = "https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4";

// Safely read saved data
function readNumber(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    if (value === null) return fallback;
    const number = Number(value);
    return Number.isSafeInteger(number) && number >= 0
      ? number : fallback;
  } catch (e) {
    return fallback;
  }
}

function readHistory() {
  try {
    const value = JSON.parse(localStorage.getItem('ct_hist') || '[]');
    return Array.isArray(value) ? value : [];
  } catch (e) {
    return [];
  }
}

let bal = readNumber('ct_bal', 0);
let views = readNumber('ct_views', 0);
let hist = readHistory();
let taskInProgress = false;

// FIX CORRUPTED OR INCONSISTENT DATA
if (views > 75 || bal !== views * 2) {
  bal = 0;
  views = 0;
  hist = [];
  localStorage.setItem('ct_bal', '0');
  localStorage.setItem('ct_views', '0');
  localStorage.setItem('ct_hist', '[]');
}

let deviceId = localStorage.getItem('ct_device');
if (!deviceId) {
  try {
    deviceId = btoa(navigator.userAgent + screen.width).substring(0, 12);
  } catch (e) {
    deviceId = 'CT' + Math.random().toString(36).substring(2, 10);
  }
  localStorage.setItem('ct_device', deviceId);
}

let myId = localStorage.getItem('ct_myId') ||
  'CT' + Math.random().toString(36).substring(2, 8).toUpperCase();
localStorage.setItem('ct_myId', myId);

// Safely display saved history
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function (char) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char];
  });
}

function render() {
  document.getElementById('bal').innerText = bal;
  document.getElementById('views').innerText = views;
  document.getElementById('bar').style.width = (views / 75 * 100) + '%';

  const cleanHist = hist.map(function (h) {
    if (typeof h === 'string') return h;
    if (h && typeof h.text === 'string') return h.text;
    try { return JSON.stringify(h); }
    catch (e) { return 'Task history entry'; }
  });

  document.getElementById('historyBox').innerHTML =
    cleanHist.slice(-10).reverse()
      .map(function (h) {
        return '<div>' + escapeHTML(h) + '</div>';
      }).join('') ||
    '<div style="color:#9ca3af">No tasks yet</div>';

  const b = document.getElementById('withdrawBtn');

  if (views >= 75) {
    b.disabled = false;
    b.innerText = '✅ WITHDRAW KES 150 - Get CODE';
    b.style.background = '#16a34a';
  } else {
    b.disabled = true;
    b.innerText = `🔒 ${75 - views} tasks left`;
  }

  document.getElementById('taskBtn').disabled =
    views >= 75 || taskInProgress;
}

function doTask() {
  // Prevent simultaneous tasks and exceeding the limit
  if (taskInProgress || views >= 75) return;

  taskInProgress = true;
  render();

  document.getElementById('status').innerText =
    'Opening ads... Wait 6 sec';

  window.open(AD_LINK, '_blank');

  setTimeout(function () {
    window.open(AD_LINK, '_blank');
  }, 400);

  setTimeout(function () {
    // Award only one task for this button activation
    if (views < 75) {
      views++;
      bal += 2;

      hist.push(
        `Task ${views} - +KES 2 - ${new Date().toLocaleTimeString()}`
      );

      localStorage.setItem('ct_views', String(views));
      localStorage.setItem('ct_bal', String(bal));
      localStorage.setItem('ct_hist', JSON.stringify(hist));

      document.getElementById('status').innerText = 'Task counted! +2';
    }

    taskInProgress = false;
    render();
  }, 6000);
}

function withdraw() {
  if (views !== 75 || bal !== 150 || taskInProgress) return;

  const timeCode = Math.floor(Date.now() / 1000 / 600);
  const rand = Math.random().toString(36).substring(2, 6).toUpperCase();

  const code =
    `CT-${myId}-${timeCode}-${deviceId}-${rand}`;

  window.open(
    `https://wa.me/254119348942?text=WITHDRAW%0ACODE:${encodeURIComponent(code)}%0AViews:${views}%20Bal:${bal}%20Dev:${encodeURIComponent(deviceId)}%20Clicks:${views * 4}`,
    '_blank'
  );
}

render();
</script></body></html>
