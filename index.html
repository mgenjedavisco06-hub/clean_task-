<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanTasks</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:20px;text-align:center}
.box{background:white;padding:30px;border-radius:15px;max-width:350px;margin:auto}
button{background:#00c851;color:white;border:none;padding:20px;border-radius:12px;font-size:20px;width:100%;font-weight:bold}
.done{background:#e8f5e9;padding:20px;border:2px solid #00c851;border-radius:12px}
</style>
</head>
<body>
<div class="box" id="box">
<h2>🧹 CleanTasks Kenya</h2>
<p>Earn KES 10 - Clean one image</p>
<img src="https://picsum.photos/300/150" style="width:100%;border-radius:10px;filter:blur(6px)" id="img">
<p id="text">This image is dirty. Clean it to earn.</p>
<button onclick="clean()" id="btn">🧼 CLEAN & EARN KES 10</button>
</div>
<script>
let isDone = localStorage.getItem('done')==='yes';
if(isDone){showDone();}
function clean(){
document.getElementById('btn').innerHTML='Opening...';
window.open('https://asiafilm.org/4/ee794686e029ba5667e87b360abfa3f4','_blank');
setTimeout(()=>{
localStorage.setItem('done','yes');
showDone();
},800);
}
function showDone(){
document.getElementById('box').innerHTML='<div class="done"><h2>✓ Task Completed!</h2><p>Image cleaned successfully</p><h3>KES 10 Earned</h3><p>Take screenshot as proof</p><br><button onclick="localStorage.clear();location.reload()" style="background:gray">Reset for new user</button></div>';
}
</script>
</body>
</html>
